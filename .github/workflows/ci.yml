name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Verify Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21 LTS (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Compile Application
        run: mvn clean compile -B

      - name: Execute Automated Test Suite (113 Tests)
        run: mvn test -B -Dsurefire.useFile=false

      - name: Package Production JAR
        run: mvn package -DskipTests -B

      - name: Archive Built JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: settlement-engine-jar
          path: target/settlement-engine.jar
          retention-days: 7

  docker-build-check:
    name: Verify Docker Container Build
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t moveinsync/settlement-engine:ci .
